name: 'Simple Version Bumper'
description: 'Bump version numbers in project files'
inputs:
  config:
    description: 'Path to config YAML file (overrides files and bump_type if provided)'
    required: false
    default: ''
  files:
    description: 'Comma-separated list of files to update version in (ignored if config is provided)'
    required: false
    default: ''
  bump_type:
    description: 'Type of version bump (major/minor/patch) (ignored if config is provided)'
    required: false
    default: 'patch'
  commit:
    description: 'Commit the changes and tag the new commit (requires git user.name/user.email to be set). Pushing is left to the workflow'
    required: false
    default: 'true'
  force:
    description: 'Bump even if there are no new commits since the last tag'
    required: false
    default: 'false'
  dry_run:
    description: 'Print what would change without changing anything'
    required: false
    default: 'false'
outputs:
  bumped:
    description: "'true' if the version was bumped, 'false' otherwise"
    value: ${{ steps.bump.outputs.bumped }}
  previous_version:
    description: 'Version before the bump'
    value: ${{ steps.bump.outputs.previous_version }}
  new_version:
    description: 'Version after the bump (also the name of the created tag)'
    value: ${{ steps.bump.outputs.new_version }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install simplebumpversion
      shell: bash
      # install from the action's own source so the code matches the ref the workflow uses
      run: pip install "$GITHUB_ACTION_PATH"

    - name: Bump version
      id: bump
      shell: bash
      env:
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_FILES: ${{ inputs.files }}
        INPUT_BUMP_TYPE: ${{ inputs.bump_type }}
        INPUT_COMMIT: ${{ inputs.commit }}
        INPUT_FORCE: ${{ inputs.force }}
        INPUT_DRY_RUN: ${{ inputs.dry_run }}
      run: |
        set -euo pipefail
        args=()

        if [[ -n "$INPUT_CONFIG" ]]; then
          args+=(--config "$INPUT_CONFIG")
        else
          # Convert comma-separated list to separate arguments, trimming whitespace
          IFS=',' read -ra files <<< "$INPUT_FILES"
          for file in "${files[@]}"; do
            file="${file#"${file%%[![:space:]]*}"}"
            file="${file%"${file##*[![:space:]]}"}"
            if [[ -n "$file" ]]; then
              args+=("$file")
            fi
          done
          if [[ ${#args[@]} -eq 0 ]]; then
            echo "::error::Either 'config' or 'files' must be provided"
            exit 1
          fi

          case "$INPUT_BUMP_TYPE" in
            major|minor|patch) args+=("--$INPUT_BUMP_TYPE") ;;
            *)
              echo "::error::Invalid bump_type '$INPUT_BUMP_TYPE' (expected major, minor or patch)"
              exit 1
              ;;
          esac
        fi

        if [[ "$INPUT_COMMIT" == "true" ]]; then
          args+=(--commit)
        fi
        if [[ "$INPUT_FORCE" == "true" ]]; then
          args+=(--force)
        fi
        if [[ "$INPUT_DRY_RUN" == "true" ]]; then
          args+=(--dry-run)
        fi

        bump-version "${args[@]}"

branding:
  icon: 'arrow-up'
  color: 'blue'
