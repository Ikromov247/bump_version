name: Bump Version

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type (major/minor/patch)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'

permissions:
  contents: write

# never run two bumps at the same time, or both would compute the same version
concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump-version:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check out the tip of the target branch so the bump commit can be pushed to it
          ref: ${{ github.event.pull_request.base.ref || github.ref_name }}
          fetch-depth: 0

      - name: Determine version bump type from PR labels
        id: bump_type
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_BUMP_TYPE: ${{ inputs.bump_type }}
          HAS_MAJOR_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'major') }}
          HAS_MINOR_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'minor') }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            echo "type=$DISPATCH_BUMP_TYPE" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_MAJOR_LABEL" == "true" ]; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_MINOR_LABEL" == "true" ]; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Set git configurations
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Bump version
        id: bump
        # use this repository's own action so changes to it are tested here
        uses: ./
        with:
          files: 'pyproject.toml'
          bump_type: ${{ steps.bump_type.outputs.type }}
          # a manual run is an explicit request to bump, even without new commits
          force: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Push changes
        if: steps.bump.outputs.bumped == 'true'
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
          TAG: ${{ steps.bump.outputs.new_version }}
        run: git push --atomic origin "HEAD:refs/heads/$TARGET_BRANCH" "refs/tags/$TAG"
